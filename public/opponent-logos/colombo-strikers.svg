<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="csShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="60%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="csGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Crowned Shield -->
  <path d="M 250,30 L 410,80 L 390,320 L 250,470 L 110,320 L 90,80 Z" fill="url(#csShieldGrad)" stroke="url(#csGoldGrad)" stroke-width="8" stroke-linejoin="round" />
  <path d="M 250,60 L 380,100 L 365,305 L 250,435 L 135,305 L 120,100 Z" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.6" />

  <!-- Golden Lion Motif -->
  <g transform="translate(250, 195) scale(1.05)">
    <!-- Lion Mane Curves -->
    <path d="M 0,-80 C -60,-80 -90,-40 -80,20 C -70,70 0,90 0,90 C 0,90 70,70 80,20 C 90,-40 60,-80 0,-80 Z" fill="url(#csGoldGrad)" />
    <!-- Lion Face Cutout -->
    <path d="M 0,-50 C -30,-50 -45,-25 -40,10 C -35,35 0,55 0,55 C 0,55 35,35 40,10 C 45,-25 30,-50 0,-50 Z" fill="#4C0519" />
    <!-- Eyes and Nose -->
    <circle cx="-16" cy="-8" r="5" fill="#FDE047" />
    <circle cx="16" cy="-8" r="5" fill="#FDE047" />
    <polygon points="0,8 -8,0 8,0" fill="#FDE047" />
    <!-- Sword Blade -->
    <path d="M -70,-20 L -90,-60 L -60,-40 Z" fill="#FDE047" />
    <path d="M 70,-20 L 90,-60 L 60,-40 Z" fill="#FDE047" />
    <!-- Ball at Feet -->
    <circle cx="0" cy="55" r="26" fill="#FFFFFF" stroke="#4C0519" stroke-width="3" />
    <polygon points="0,45 8,51 5,61 -5,61 -8,51" fill="#4C0519" />
  </g>

  <!-- Banner -->
  <rect x="75" y="340" width="350" height="52" rx="10" fill="#4C0519" stroke="url(#csGoldGrad)" stroke-width="3" />
  <text x="250" y="373" font-family="'Impact', 'Arial Black', sans-serif" font-size="23" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="2">
    COLOMBO STRIKERS
  </text>
  <text x="250" y="420" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    SRI LANKA • ESPORTS
  </text>
</svg>
