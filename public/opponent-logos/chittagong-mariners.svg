<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cmShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="cmSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <path d="M 250,25 C 390,25 440,110 430,260 C 420,380 320,465 250,480 C 180,465 80,380 70,260 C 60,110 110,25 250,25 Z" fill="url(#cmShieldGrad)" stroke="url(#cmSilverGrad)" stroke-width="8" />

  <!-- Anchor & Waves Motif -->
  <g transform="translate(250, 195) scale(1.15)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-60" r="14" fill="none" stroke="#FFFFFF" stroke-width="6" />
    <!-- Anchor Shaft -->
    <rect x="-4" y="-45" width="8" height="90" fill="#FFFFFF" />
    <rect x="-35" y="-30" width="70" height="8" rx="3" fill="#FFFFFF" />
    <!-- Anchor Flukes -->
    <path d="M -60,20 C -60,70 60,70 60,20 L 70,25 C 65,85 -65,85 -70,25 Z" fill="#FFFFFF" />
    <!-- Ball Center -->
    <circle cx="0" cy="50" r="26" fill="#FFFFFF" stroke="#0C4A6E" stroke-width="4" />
    <polygon points="0,40 8,46 5,56 -5,56 -8,46" fill="#0C4A6E" />
  </g>

  <!-- Banner -->
  <rect x="65" y="340" width="370" height="52" rx="10" fill="#082F49" stroke="url(#cmSilverGrad)" stroke-width="3" />
  <text x="250" y="373" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
    CHITTAGONG MARINERS
  </text>
  <text x="250" y="420" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    BANGLADESH • ESPORTS
  </text>
</svg>
