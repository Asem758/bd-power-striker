<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kkShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="kkEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="kkSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Circular Base Shield with Falcon Wing Horns -->
  <path d="M 250,25 C 380,25 450,110 440,250 C 430,370 330,465 250,480 C 170,465 70,370 60,250 C 50,110 120,25 250,25 Z" fill="url(#kkShieldGrad)" stroke="url(#kkEmeraldGrad)" stroke-width="8" />
  
  <!-- Inner Ring -->
  <circle cx="250" cy="240" r="175" fill="none" stroke="url(#kkSilverGrad)" stroke-width="3" stroke-dasharray="10 5" opacity="0.6" />

  <!-- Falcon Wings Graphic -->
  <g transform="translate(250, 200)">
    <!-- Left Wing Feathers -->
    <path d="M -20,10 C -80,-40 -150,-10 -160,50 C -120,30 -70,30 -20,20 Z" fill="url(#kkEmeraldGrad)" />
    <path d="M -20,-10 C -90,-80 -140,-60 -130,-10 C -90,-10 -50,-5 -20,0 Z" fill="#FFFFFF" />
    <path d="M -20,-30 C -80,-110 -110,-90 -90,-50 C -60,-45 -40,-35 -20,-20 Z" fill="url(#kkSilverGrad)" />

    <!-- Right Wing Feathers -->
    <path d="M 20,10 C 80,-40 150,-10 160,50 C 120,30 70,30 20,20 Z" fill="url(#kkEmeraldGrad)" />
    <path d="M 20,-10 C 90,-80 140,-60 130,-10 C 90,-10 50,-5 20,0 Z" fill="#FFFFFF" />
    <path d="M 20,-30 C 80,-110 110,-90 90,-50 C 60,-45 40,-35 20,-20 Z" fill="url(#kkSilverGrad)" />

    <!-- Crescent and Star -->
    <path d="M 15,-40 A 30 30 0 1 0 -15,10 A 24 24 0 1 1 15,-40 Z" fill="#FFFFFF" />
    <polygon points="12,-20 17,-15 13,-9 9,-14" fill="#34D399" transform="scale(1.3)" />

    <!-- Soccer Ball -->
    <circle cx="0" cy="65" r="32" fill="#FFFFFF" stroke="#022C22" stroke-width="4" />
    <polygon points="0,52 11,60 7,72 -7,72 -11,60" fill="#022C22" />
    <line x1="0" y1="52" x2="0" y2="35" stroke="#022C22" stroke-width="3" />
    <line x1="11" y1="60" x2="25" y2="55" stroke="#022C22" stroke-width="3" />
    <line x1="7" y1="72" x2="19" y2="86" stroke="#022C22" stroke-width="3" />
    <line x1="-7" y1="72" x2="-19" y2="86" stroke="#022C22" stroke-width="3" />
    <line x1="-11" y1="60" x2="-25" y2="55" stroke="#022C22" stroke-width="3" />
  </g>

  <!-- Banner -->
  <rect x="75" y="345" width="350" height="52" rx="10" fill="#022C22" stroke="url(#kkEmeraldGrad)" stroke-width="3" />
  <text x="250" y="378" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    KARACHI KICKERS
  </text>
  <text x="250" y="425" font-family="sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="4">
    PAKISTAN • ESPORTS
  </text>
</svg>
